<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados | Maratón 7 Colores 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E5C96;
    --navy-deep:#123A63;
    --lime:#CAED69;
    --teal:#2DA7B1;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;color:var(--white);
    background:var(--navy-deep) url('manual-corredor-assets/images/image18.avif') center/cover no-repeat;
    padding:40px 20px;
  }
  .box{max-width:640px;width:100%;text-align:center;}
  .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:36px;}
  .logo img{width:52px;height:52px;object-fit:contain;filter:brightness(0) invert(1);}
  .logo span{font-family:'Bebas Neue',sans-serif;font-size:21px;line-height:1;letter-spacing:.03em;text-align:left;}
  .eyebrow{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);font-size:clamp(14px,2.4vw,18px);margin:0 0 8px;}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;margin:0;font-size:clamp(44px,12vw,96px);overflow-wrap:anywhere;}
  h1 .accent{display:block;color:var(--lime);}
  p.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;margin:24px auto 34px;max-width:520px;opacity:.95;}
  .btn{
    display:inline-block;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.02em;
    padding:13px 32px;border-radius:999px;text-decoration:none;cursor:pointer;
    background:var(--lime);color:var(--navy);border:2px solid var(--lime);
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .btn:hover{background:var(--white);color:#1E5C96;border-color:#1E5C96;}
</style>
</head>
<body>
  <main class="box">
    <div class="logo">
      <img src="manual-corredor-assets/icons-svg/image7.svg" alt="Maratón 7 Colores">
      <span>MARATÓN<br>7 COLORES</span>
    </div>
    <p class="eyebrow">Resultados oficiales 2026</p>
    <h1>Página en <span class="accent">construcción</span></h1>
    <p class="lead">Estamos trabajando en esto. Muy pronto podrás consultar aquí los resultados oficiales de la Maratón 7 Colores 2026.</p>
    <a class="btn" href="index.html">Volver al manual</a>
  </main>
</body>
</html>
